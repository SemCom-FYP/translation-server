[project]
name = "translation-server"
version = "0.2.0"
description = "Simultaneous speech-to-speech translation server (Meta SeamlessStreaming)"
requires-python = ">=3.10,<3.11"
dependencies = ["aiohttp>=3.9", "numpy<2", "soxr>=0.3.7"]

[project.optional-dependencies]
vad = ["silero-vad"]
encodec = ["encodec"]

[tool.setuptools]
packages = ["translation_server"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
